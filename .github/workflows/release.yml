name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-portable:
    name: Build Windows portable zip
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = node -p "require('./package.json').version"
          if ("v$version" -ne $tag) {
            Write-Error "Tag $tag 与 package.json 版本 v$version 不一致；请先升级版本再打 tag"
            exit 1
          }

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Prepare resource folders
        run: New-Item -ItemType Directory -Force -Path resources/models,resources/asr,resources/tts | Out-Null

      - name: Build app
        run: npm run build:app

      - name: Build installers and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win nsis zip --publish always

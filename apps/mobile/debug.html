<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>OpenGal Debug</title>
    <script src="/libs/live2dcubismcore.min.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <div id="debug" style="position:fixed;top:0;left:0;right:0;background:#1a1a2e;color:#0f0;font:12px monospace;padding:8px;z-index:9999;white-space:pre-wrap;max-height:50vh;overflow:auto"></div>
    <script type="module">
      const log = (...args) => {
        const el = document.getElementById('debug')
        el.textContent += args.join(' ') + '\n'
        console.log('[OG-DEBUG]', ...args)
      }

      log('=== OpenGal Mobile Diagnostics ===')
      log('URL:', window.location.href)
      log('UA:', navigator.userAgent)
      log('isMobile param:', new URLSearchParams(location.search).get('mobile'))
      log('window.PIXI:', typeof window.PIXI)
      log('window.Live2DCubismCore:', typeof window.Live2DCubismCore)
      log('window.opengal:', typeof window.opengal)

      // Test Preferences
      try {
        const { Preferences } = await import('@capacitor/preferences')
        log('Preferences: available')
        const { value } = await Preferences.get({ key: 'opengal.config' })
        log('Stored config:', value ? value.slice(0, 200) : '(empty)')
      } catch (e) {
        log('Preferences ERROR:', e.message)
      }

      // Test CDN access
      try {
        const res = await fetch('https://cdn.jsdelivr.net/gh/guansss/pixi-live2d-display/test/assets/haru/haru_greeter_t03.model3.json')
        log('CDN fetch status:', res.status)
        const json = await res.json()
        log('CDN model3.json keys:', Object.keys(json).join(', '))
      } catch (e) {
        log('CDN fetch ERROR:', e.message)
      }

      // Load entry
      log('Loading entry.ts...')
      await import('./src/entry.ts')
      log('entry.ts loaded, waiting for renderer...')

      // Check after 3s
      setTimeout(() => {
        const root = document.getElementById('root')
        log('root.innerHTML length:', root?.innerHTML?.length ?? 0)
        log('root children:', root?.children?.length ?? 0)
        const canvases = document.querySelectorAll('canvas')
        log('canvas count:', canvases.length)
        if (canvases.length > 0) {
          const c = canvases[0]
          log('canvas size:', c.width, 'x', c.height)
          log('canvas clientSize:', c.clientWidth, 'x', c.clientHeight)
          const ctx = c.getContext('webgl2') || c.getContext('webgl')
          log('webgl context:', !!ctx)
        }
        // Check for Live2D loading status text
        const texts = document.body.innerText
        log('page text (first 500):', texts.slice(0, 500))
        log('window.opengal after load:', typeof window.opengal)
        if (window.opengal) {
          window.opengal.config.get().then(r => {
            log('config.get success:', r.success)
            log('config.showLive2D:', r.data?.showLive2D)
            log('config.activeCharacterId:', r.data?.activeCharacterId)
            log('config.model:', r.data?.model ? 'has model' : 'null')
          })
          window.opengal.character.list().then(r => {
            log('character.list success:', r.success)
            log('characters:', r.data?.map(c => c.id).join(', '))
          })
          window.opengal.model.resolveFromCard('ouka').then(r => {
            log('resolveFromCard success:', r.success)
            log('model data:', r.data ? JSON.stringify({modelUrl: r.data.modelUrl, scale: r.data.scale}).slice(0,200) : 'null')
          })
        }
      }, 3000)

      // Check again after 6s (model might be slow to load from CDN)
      setTimeout(() => {
        const canvases = document.querySelectorAll('canvas')
        if (canvases.length > 0) {
          const c = canvases[0]
          log('[6s] canvas size:', c.width, 'x', c.height)
          log('[6s] canvas clientSize:', c.clientWidth, 'x', c.clientHeight)
        }
        // Check for error or loading text
        const texts = document.body.innerText
        log('[6s] page text (first 300):', texts.slice(0, 300))
      }, 6000)
    </script>
  </body>
</html>
